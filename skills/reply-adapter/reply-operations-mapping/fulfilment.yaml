  # ------------------------------------------ 14 — consent, suppression and privacy

  - name: outreach.precheck
    fulfilment: partial
    surface: >
      contacts -> Get a contact's statuses;
      contact-blacklist-rules -> List email blacklist rules, List domain blacklist rules,
      List email exception blacklist rules
    scopes: [contacts:read]
    order: >
      Read the contact's statuses first — the opted-out state is a global flag there, and a
      person opted out is a stop with no further questions. Then search the email rules for
      the address and the domain rules for its domain. Read the exception rules as well: a
      match on a domain rule is not final on its own.
    missing: >
      It answers one question — is this person opted out or excluded on email — and the
      operation asks four. There is no channel dimension, so a social or phone precheck is not
      covered. There is no timing half, so "if not, when" cannot be answered. There is no
      consent basis and no external-register gate. Nothing says what would fix it. Say all of
      this before a user commits to a route that treats the precheck as sufficient.
    notes: >
      The result is stale the moment it returns, here as in the contract. Nothing about
      knowing which endpoint answers it changes that.

  - name: suppression.check
    fulfilment: partial
    surface: >
      contact-blacklist-rules -> List email blacklist rules, List domain blacklist rules,
      List email exception blacklist rules
    scopes: [contacts:read]
    missing: >
      The "why". A rule carries its pattern and whether it is system-wide, and nothing else —
      no reason class comes back, so the answer is yes-or-no with no ground for it. Only email
      addresses and domains are covered; a number, a social profile or a whole account has no
      equivalent.
    notes: >
      The listings filter by pattern, so a raw identifier can be checked without it being a
      contact in the system — which is the part of this operation that matters.

  - name: suppression.list
    fulfilment: partial
    surface: >
      contact-blacklist-rules -> List email blacklist rules, List domain blacklist rules,
      List email exception blacklist rules
    scopes: [contacts:read]
    missing: >
      Three separate lists rather than one, and none of the three facets the operation
      promises: no scope, no reason class, no record of who added the entry. Numbers, social
      profiles and whole accounts are not represented at all.

  - name: suppression.add
    fulfilment: partial
    surface: >
      contact-blacklist-rules -> Create an email blacklist rule, Create a domain blacklist
      rule, Bulk create email blacklist rules, Bulk create domain blacklist rules
    scopes: [contacts:write]
    missing: >
      "And here is why" has nowhere to go — no reason is recorded against a rule, so the
      reason has to be kept in the agent's own record or it is lost, and suppression.remove
      later has nothing to weigh. Numbers, social profiles and whole accounts have no
      equivalent.
    notes: >
      The contract's read-before-repeating has a real surface here: search the listing for the
      pattern first. Adding a pattern that already exists is a refusal, so a blind retry is
      wrong.

  - name: suppression.remove
    fulfilment: partial
    surface: >
      contact-blacklist-rules -> Delete an email blacklist rule, Delete a domain blacklist
      rule, Bulk delete email blacklist rules, Bulk delete domain blacklist rules
    scopes: [contacts:write]
    missing: >
      The evidence that licenses the lift is not recorded, and no retention floor is exposed
      to check against — so the one guard the contract puts on this irreversible act cannot be
      enforced by the product and must be enforced by the agent before the call. Email
      addresses and domains only.

  - name: optout.record
    fulfilment: partial
    surface: >
      contact-blacklist-rules -> Create an email blacklist rule, Bulk create email blacklist
      rules
    scopes: [contacts:write]
    missing: >
      It records the exclusion, not the act. What they said, where it arrived, when they did
      it and when we learned of it have nowhere to go, so the evidence that this was their
      decision is not retained. The product carries its own opted-out state on a contact —
      readable through Get a contact's statuses — but no documented surface sets it.
    notes: >
      This is the protective floor operation: recording that somebody said stop is performed
      first and reported immediately. A blacklist rule stops future sends, which is the effect
      that matters most; keep the act itself in the agent's own record alongside it.

  - name: optout.poll
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing pulls un-ingested stop
      signals from the channel — one-click unsubscribes, list-unsubscribe requests, blocks or
      stop keywords.
    notes: >
      The notification surface carries a contact-opted-out event. That is a push about an
      opt-out the product has already ingested, not the backlog of ones it has not, and the
      two are not interchangeable: subscribing to it tells you nothing about what is waiting
      at the channel.

  - name: optout.confirm
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. No opt-out confirmation exists
      as its own act, and no ledger records whether one was already sent.
    notes: >
      A direct email to a contact can be sent, and using it for this is the substitution to
      refuse. This confirmation is exactly-once, non-promotional and may never require
      anything of the recipient; with no ledger to check, a second one is a breach rather than
      a duplicate, and nothing here would stop it.

  - name: consent.record
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. There is no permission record:
      what they were told, when, how it was captured and what it covers have nowhere to live.

  - name: consent.revalidate
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. With no basis recorded there
