      Connection state and configured limits are readable, and the mailbox read reports
      whether the provider has locked or throttled the account. Warm-up position, the
      channel's automation sanction, and any statement of how much of today's capacity is
      still available are not exposed — so three of the five things this operation promises
      have to be tracked by the agent or left unanswered. Numbers and business messaging
      identities are not covered.
    notes: >
      The connectivity tests verify the credential actively rather than reporting a cached
      status, which is the difference that matters when an account looks fine and is not.
      A disconnected or erroring account is still a hard stop: this is a core operation and
      the launch chain refuses on it.

  - name: sender.connect
    fulfilment: partial
    surface: >
      email-accounts -> Create an email account, Connect Gmail account via OAuth,
      Connect Office 365 account via OAuth;
      linkedin-accounts -> Create a connection link, Create a direct connection link
    scopes: [channels:write]
    missing: >
      Mailboxes and social accounts only; numbers and business messaging identities have no
      surface. On the social channel the call produces a link a person has to complete, so the
      operation is not finished when the call returns.
    notes: >
      Poll the pending social list until the account appears in the real one. Until then it is
      the contract's pending-setup state, and reporting it as connected is how a campaign gets
      launched against a sender that cannot send.

  - name: sender.disconnect
    fulfilment: partial
    surface: >
      email-accounts -> Delete an email account, Bulk delete email accounts;
      linkedin-accounts -> Delete a LinkedIn account, Bulk delete LinkedIn accounts
    scopes: [channels:write]
    missing: >
      It deletes rather than detaches, and the guard the contract puts on this operation is
      absent: nothing refuses while live enrolments or open conversations still depend on the
      sender, and no rebind target can be supplied. The check is the caller's, and it has to
      happen before the call because there is nothing to undo afterwards.
    notes: >
      What is bound to a sender is readable only one campaign at a time
      (sequence-email-accounts -> List email accounts in sequence; sequence-linkedin-accounts
      -> List LinkedIn accounts for a sequence), so the check is a scan. On the social channel
      sender.pause is the reversible alternative and is usually what the user actually wants.

  - name: sender.reauthorize
    fulfilment: partial
    surface: >
      linkedin-accounts -> Reconnect a LinkedIn account;
      email-accounts -> Connect Gmail account via OAuth, Connect Office 365 account via OAuth
    scopes: [channels:write]
    missing: >
      Only the social channel has a reconnect that names the existing account. On a mailbox
      the documented route is re-running the provider connection, and nothing states that the
      history behind it survives — which is the whole promise of this operation. Verify by
      re-reading rather than assuming, and tell the user what you could not confirm.

  - name: sender.pause
    fulfilment: partial
    surface: linkedin-accounts -> Toggle LinkedIn account status
    scopes: [channels:operate]
    missing: >
      Social accounts only. A mailbox has no documented pause — the resume surface exists with
      no counterpart — so on email the protective move has to be made one level up, at
      campaign.pause or by removing the sender from the campaign. Say which one you used,
      because they are not the same blast radius.
    notes: >
      The social call flips between enabled and disabled rather than setting a state. Read the
      account first: issued blind against an already-paused account it re-enables it, which
      turns the first move in an incident into the worst one.

  - name: sender.resume
    fulfilment: partial
    surface: >
      email-accounts -> Resume sending;
      linkedin-accounts -> Toggle LinkedIn account status
    scopes: [channels:operate]
    missing: >
      Nothing refuses the resume on an invalid warm-up position, because no warm-up position
      is exposed at all — the contract's guard has to be enforced by the caller or it is not
      enforced. The mailbox surface is scoped to accounts the provider locked or throttled,
      not to an operator pause, and no operator pause exists on that channel.
    notes: >
      Resolve the underlying problem before calling, then re-read the account to confirm the
      lock actually cleared. The social call flips rather than sets — read state first, same
      as with sender.pause.

  - name: sender_limit.set
    fulfilment: partial
    surface: >
      linkedin-accounts -> Update LinkedIn account limits;
      email-accounts -> Update an email account
    scopes: [channels:write]
    missing: >
      The contract's one decision is two different surfaces, one per channel, and only the
      social one is a dedicated limits endpoint — on a mailbox the limits ride on the account
      update, so a careless call can overwrite settings the caller did not intend to touch.
      Numbers and business messaging identities have no surface.
    notes: >
      Read the limits in force first and re-read after: report what actually took, not what
      was requested. Lowering is protective; raising is the direction that needs the approval,
      and the mapping does not change that.

  - name: warmup_plan.set
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. No ramp can be defined, read
      or started, and no warm-up position is exposed anywhere in the API.
    notes: >
      This is the absence that costs the most in this family: sender.resume refuses on the
      warm-up position, and with no position readable that refusal cannot be automated. Tell
      the user the ramp is theirs to hold, and hold it in the agent's own record.

  - name: message_element.set
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. The legal identification
      block, the postal address, the channel's stop artefacts and the tracking domain have no
      per-sender configuration surface.

  - name: sender.reserve
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. There is no allowance
      reservation, so two parallel runs against one sender can spend the same capacity twice
      and neither will be told.

  - name: sender.release
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing to give back, since
      nothing can be claimed.

  - name: sender.summarize
    fulfilment: absent
    surface: email-accounts -> Get email account stats, Filter email account stats
    because: >
      The per-sender figures surface is documented Coming soon and is not callable today. Say
      that rather than reaching for something adjacent, and check the page again before
      planning around it.
    notes: >
      The reporting overview is account-wide, not per sender, and answers a different
      question. Substituting it produces a number that looks like this sender's and is not,
      which is worse than having none. Even when the stats surface opens, failures by class,
      complaints with their publisher and denominator, deferrals and throttles are not
      promised by it.

  - name: restriction.record
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. There is no restriction
      ledger, so a restriction cannot be recorded, counted, or carried forward.
    notes: >
      The arrival of one is observable — the notification surface carries account-alert,
      connection-lost and account-error events, and the mailbox read reports a provider lock.
      What is missing is the durable record behind them. Keep it in the agent's own record:
      the recurrence count and the invalidated warm-up position both hang off it, and
      platforms escalate on how often a sender is restricted rather than on what for.

  - name: restriction.appeal
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. No appeal route is exposed;
      where the platform offers one it is outside this API, and saying so plainly is the
      correct answer.

  - name: sender_pool.create
    fulfilment: partial
    surface: >
      sequence-email-accounts -> Set sequence email accounts, Assign email account to
      sequence;
      sequence-linkedin-accounts -> Assign a LinkedIn account to a sequence
    scopes: [sequences:read, sequences:operate]
    missing: >
      There is no pool object. The grouping exists only as the set of senders bound to one
      campaign, so it cannot be named, cannot be created before the campaign exists, and
      cannot be reused by a second campaign without being rebuilt. Routing policy is not part
      of it.
    notes: >
      Rotation across the bound senders is the product's own behaviour, so do not tell a user
      that sending across several senders is unavailable — that is a wrong answer, not a
      cautious one. What is unavailable is the reusable, named, independently routable pool.

  - name: sender_pool.update
    fulfilment: partial
    surface: >
      sequence-email-accounts -> Set sequence email accounts, Assign email account to
      sequence, Remove email account from sequence;
      sequence-linkedin-accounts -> Assign a LinkedIn account to a sequence, Remove a LinkedIn
      account from a sequence
    scopes: [sequences:read, sequences:operate]
    missing: >
      Membership changes, one campaign at a time. The routing policy does not — and sticky per
      recipient in particular is not selectable, which on a conversational channel is
      correctness rather than optimisation. Say that before a user commits to a route that
      needs a recipient to keep hearing from the same sender.
    notes: >
      Setting the whole set replaces it. Read the current members first, or a call meant to
      add one sender silently removes the rest.

  - name: sender_pool.list
    fulfilment: partial
    surface: >
      sequence-email-accounts -> List email accounts in sequence;
      sequence-linkedin-accounts -> List LinkedIn accounts for a sequence
    scopes: [sequences:read]
    missing: >
      Pools cannot be enumerated. Every read is scoped to one campaign, so "what pools exist"
      is answerable only by walking every campaign, and how work routes across the members is
      not reported at all.

  - name: sender_pool.delete
    fulfilment: partial
    surface: >
      sequence-email-accounts -> Remove email account from sequence;
      sequence-linkedin-accounts -> Remove a LinkedIn account from a sequence
    scopes: [sequences:read, sequences:operate]
    missing: >
      There is no pool to dissolve. Removing every binding leaves the campaign with no sender
      rather than dissolving a named group — nothing refuses it while the campaign is live and
      no replacement target can be supplied, so the campaign is left unable to send and
      nothing says so.
    notes: >
      The capabilities themselves are untouched, as the contract expects: this removes
      bindings, not senders.

  - name: sending_domain.register
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Domains are not a first-class
      entity here; a sender carries its address and that is all.

  - name: sending_domain.list
    fulfilment: absent
    because: not evidenced — no documented surface was found for this.

  - name: sending_domain.retire
    fulfilment: absent
    because: not evidenced — no documented surface was found for this.

  - name: authentication_requirement.list
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. What has to be published for a
      domain to authenticate is not stated anywhere in the API.

  - name: domain_compliance.check
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. No verdict per publisher and
      per requirement is available, so a failing requirement cannot be named.

  - name: domain_reputation.get
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. No reputation signal,
      blocklist listing or dataset is exposed.

  - name: message_compliance.check
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing evaluates a rendered
      message against what it will be held to: required elements, a working unsubscribe, or
      the reputation of the domains it links to.
    notes: >
      The rendered message itself can be obtained (email-templates -> Render an email
      template, Send a test email), so the check can be performed outside the product against
      a real rendering rather than against the source. That is worth doing, and it is not this
      operation — report it as an external check.

  - name: placement_test.create
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. There is no seed-list send and
      no per-provider placement result.
    notes: >
      The email-validation surface estimates and schedules address validation. That answers
      whether an address exists, never where a message lands, and offering it here would
      answer a deliverability question with a data-quality one.

  - name: placement_test.get
    fulfilment: absent
    because: not evidenced — no documented surface was found for this.

  - name: messaging_registration.submit
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. No brand or use-case
      registration exists, because the channels that require one before any send is permitted
      are not represented in this API.

  - name: messaging_registration.get
    fulfilment: absent
    because: not evidenced — no documented surface was found for this.

  - name: approved_content.submit
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. No content is submitted to a
