  - name: stoprule.set
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: stoprule.list
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: stoprule.clear
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: stoprule_firing.list
    fulfilment: absent
    because: >
      not evidenced — nothing stops the work by itself here, so there are no firings to list. When
      sending is off in this product it was a person or an agent that stopped it, and the reason
      lives in the run record rather than in the API.

  - name: stoprule_firing.get
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: outreach.hold
    fulfilment: partial
    surface: >
      contact-blacklist-rules -> Create an email blacklist rule, Create a domain blacklist rule,
      Bulk create email blacklist rules, Bulk create domain blacklist rules
    scopes: [contacts:write]
    missing: >
      This blocks future contact and nothing else. Live enrolments, scheduled steps, open tasks,
      pending approvals and outstanding meeting proposals are untouched by it, and the rule
      returns no per-item ledger of who was actually reached. The kill switch the contract
      describes is only realised once those are stopped too, through their own operations, and
      every one of them has to be reported.
    notes: >
      A person is held by an email rule and a company or a domain by a domain rule. Rules are
      account-wide, so check the existing rules before adding one and expect the block to apply to
      work other people own.

  - name: outreach.release
    fulfilment: partial
    surface: >
      contact-blacklist-rules -> Delete an email blacklist rule, Delete a domain blacklist rule,
      List email blacklist rules, List domain blacklist rules
    scopes: [contacts:write, contacts:read]
    missing: >
      Deleting the rule lifts the block, but nothing resumes by itself: whatever was stopped when
      the hold went on has to be restarted deliberately, and no ledger of what was held exists to
      restart it from. Re-check each person's eligibility first — the contract requires it and
      this product will not.

  # --------------------------------------- 18 — the team: people, ownership, workload and targets
  # Evidence: the user-account pages, the contact and account owner endpoints, the task
  # reassignment endpoints, and the endpoint index checked for workload, quota and goal surfaces.

  - name: actor.list
    fulfilment: partial
    surface: user-account -> List team users
    missing: >
      Identity only — the team, the user identifier, the display name and the email address. The
      state the operation asks for, active, ramping, unavailable or gone, is not carried, so this
      read cannot tell an agent whether the person it is about to hand work to is still there.
    notes: >
      No scope required. It covers the teams this credential can act in; people outside them do
      not appear, which is a different answer from not existing.

  - name: actor.get
    fulfilment: partial
    surface: user-account -> Get current user, List team users
    missing: >
      Only the calling credential has a record of its own. Anyone else is an identity row in the
      team listing and nothing more — no state, and none of the ceilings that apply to them.

  - name: team.list
    fulfilment: direct
    surface: user-account -> List team users
    notes: >
      Every row carries the team it belongs to, so one read answers both which teams exist and who
      is in them. No scope required. Teams this credential cannot act in are not listed.

  - name: workload.get
    fulfilment: absent
    because: >
      not evidenced — checked against the endpoint index, nothing reports what a person is
      carrying. Open tasks and live enrolments can each be listed on their own, but no surface
      answers the question this operation asks, and adding up two listings is not the same answer.

  - name: workload_policy.define
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: workload_policy.get
    fulfilment: absent
