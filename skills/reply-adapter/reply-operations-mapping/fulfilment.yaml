  # ---------------------------------------------- 16 — social and messaging channels

  - name: social_invitation.send
    fulfilment: direct
    surface: direct-outreach -> Send a LinkedIn connection request to a contact
    scopes: [contacts:operate]
    notes: >
      The optional note is supported, and that is exactly why the contract's confirm_each
      applies: it is content addressed to one named person, so the literal text is approved
      before the call, not a description of it. The person must already be a contact carrying
      a profile URL, and the caller names which connected social account sends it — so
      sender.health comes first. The send happens outside any campaign, which means campaign
      pacing does not apply to it and the daily invitation limit has to be respected by the
      caller; see linkedin-guardrails for the pacing this operation is subject to.
      The contract's read before repeating — the invitation state for this pair — has no
      surface here, because social_invitation.list is absent. Keep that ledger in the agent's
      own record, or a retry becomes a second invitation to somebody who already has one.

  - name: social_invitation.list
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Invitations sent cannot be
      listed, so neither what is pending nor how old it is can be answered.
    notes: >
      The pending social-account listing is a different thing despite the similar name: it is
      accounts waiting to finish connecting to the product, not invitations waiting on people.
      Confusing the two produces a confident answer to a question nobody asked.

  - name: social_invitation.withdraw
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. A sent invitation cannot be
      taken back through the API.

