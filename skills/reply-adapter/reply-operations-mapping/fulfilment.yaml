  # ----------------------------------------------------------- 19 — accounts and buying groups
  # Evidence: the account pages, read against the account record shape on its own doc page.

  - name: account.get
    fulfilment: direct
    surface: accounts -> Get an account
    scopes: [contacts:read]
    notes: >
      The record carries the owner, the stage it is in and how many people are linked to it. The
      verification read after any account write.

  - name: account.search
    fulfilment: direct
    surface: accounts -> Filter accounts, List accounts
    scopes: [contacts:read]
    notes: >
      Companies already held, never an outside database and never metered — matching the contract
      exactly. The discovery family is where an outside search belongs.

  - name: account.update
    fulfilment: partial
    surface: accounts -> Update an account
    scopes: [contacts:write]
    missing: >
      The account's stage can be moved and the rest of the record edited, but the tier the
      contract names has no home on the record and neither does the reason for the change. The
      stages are whatever this account has declared, so resolve the words the user says against
      them before writing — a stage that does not exist is a guess.

  - name: account.claim
    fulfilment: absent
    because: >
      not evidenced — there is no lease on an account here. Ownership can be changed, which is a
      different and heavier act: it does not expire by itself, and using it as a claim would leave
      the account permanently reassigned.

  - name: account.release
    fulfilment: absent
    because: not evidenced — nothing claims an account, so there is nothing to release.

  - name: account_membership.create
    fulfilment: direct
    surface: accounts -> Bulk add contacts to an account
    scopes: [contacts:operate]
    notes: >
      Bulk-shaped: reconcile every person in the response rather than reporting the call. Attach
      deliberately, so that four spellings of one company do not become four accounts.

  - name: account_membership.list
    fulfilment: partial
    surface: accounts -> List contacts for an account
    scopes: [contacts:read]
    missing: >
      Who is attached, and no more. How each person came to be attached is not recorded, so the
      basis the contract wants on every row cannot be given, and whether someone is being touched
      right now needs a separate read against the sequence they are in.

  - name: account_membership.delete
    fulfilment: direct
    surface: accounts -> Bulk remove contacts from an account
    scopes: [contacts:operate]
    notes: >
      Detaches the person from the company; it does not delete the person and does not stop any
      outreach they are in.

  - name: collision.check
    fulfilment: partial
    surface: >
      accounts -> List contacts for an account; sequence-contacts -> List contacts in sequence
      with extended state, Get a contact in a sequence
    scopes: [contacts:read, sequences:read]
    missing: >
      Only outreach collisions are visible, and only by assembling them: the people on the
      account, then each one's state in the sequences they are in, then the owner on each record.
      A live customer, support or opportunity motion is invisible here — it lives in the CRM — so
      a clean answer from this check is not evidence that the company is free.
    notes: >
      Re-run it immediately before enrolling. Collisions appear between planning and execution,
      and the gap is exactly where the embarrassing double-touch happens.

  - name: buying_group.define
    fulfilment: absent
    because: >
      not evidenced — people can be attached to an account, but nothing records what each of them
      does in a decision, so a group with roles cannot be expressed here.

  - name: buying_group.get
    fulfilment: absent
    because: not evidenced — no group with roles is stored, so there is none to return.

  - name: buying_group.enroll
    fulfilment: absent
    because: >
      not evidenced — no surface enrols a group as a group. Enrolling several people from one
      account one by one is a different act: nothing staggers them, orders them, or reacts to one
      person's reply on behalf of the others, and doing it by hand while calling it this operation
      would hide exactly the coordination the operation exists for.

  # --------------------------------------------------------------------------- 20 — measurement
  # Evidence: the reports group in the endpoint index, the sequence stats anchors carried by the
  # 1.1.0 mapping, and the index checked for export, opportunity and metric-definition surfaces.

  - name: engagement.summarize
    fulfilment: partial
    surface: >
      reports -> Get email reporting overview, Get calls reporting overview, Get tasks reporting
      overview, Get LinkedIn reporting overview, Get channel efficiency overview, Get team
      performance overview; sequences -> Get stats for all sequences, Get sequence stats
    scopes: [reporting:read, sequences:read]
    missing: >
      The grouping is not an argument. Each report offers the one breakdown it was built for — by
      channel, by sequence, by team member — and a question that needs a different grouping has to
      be assembled from the rows behind the numbers instead. The measure set is likewise the
      report's, not the caller's.
    notes: >
      These endpoints are rate-limited harder than the rest of the API: sequential calls, cached
      within the session, no polling. Report the window alongside every figure — two numbers are
      only comparable when the window and the basis match.

  - name: engagement_event.list
    fulfilment: direct
    surface: >
      reports -> List email activity, List call activity, List task activity, List LinkedIn
      activity
    scopes: [reporting:read]
    notes: >
      One listing per channel — these are the rows behind the summary, and the route to any
      grouping the overviews do not offer. Same stricter rate limits.

  - name: funnel.summarize
    fulfilment: partial
    surface: >
      reports -> Get email reporting overview, Get channel efficiency overview, List meetings
    scopes: [reporting:read]
    missing: >
      No surface returns a ladder. The stages come from separate reads, and neither the
      denominator a stage is measured against nor how well that stage can be known at all is
      stated anywhere — the caller declares both and has to say so when reporting the result.
      Stages past the meeting are not covered by any of these.

  - name: opportunity.summarize
    fulfilment: absent
    because: >
      not evidenced — checked against the endpoint index, nothing here carries opportunities or
      revenue. That answer lives in the CRM, and reporting meetings as though they were the far
      end of the funnel would overstate what is known.

  - name: attribution.explain
    fulfilment: absent
    because: >
      not evidenced — no attribution model is stated anywhere, so nothing can explain why an
      outcome was credited where it was, or what another model would have said.

  - name: response_time.summarize
    fulfilment: absent
    because: >
      not evidenced — no documented surface reports time from arrival to first touch, or from a
      reply arriving to it being answered.

  - name: metric.describe
    fulfilment: absent
    because: >
      not evidenced — checked against the endpoint index, there is no enumeration or definition
      surface. What a figure means here is prose on its report page, read by a human, and it says
      nothing about how far the figure can be trusted.

  - name: metric.compare
    fulfilment: absent
    because: >
      not evidenced — no surface compares two arms or reports a sample size and an interval. Two
      report calls placed side by side are not this operation: the arithmetic that says whether
      the difference means anything is the part that is missing.

  - name: export.request
    fulfilment: absent
    because: >
      not evidenced — checked against the endpoint index, no general data export exists. The
      reporting listings return rows inline and paginated, which is a read rather than a bounded
      extract, and treating one as the other would move personal data with none of the handling an
      extract implies.

  - name: export.get
    fulfilment: absent
    because: not evidenced — nothing produces an extract here, so there is none to collect.

  # ---------------------------------------------------------------- 21 — introspection and runtime
  # Evidence: the user-account and background-job pages, the custom field group, the inbox
  # category group, the documented rate limits, and the index checked for an idempotency lookup.

  - name: operation.search
    fulfilment: absent
    because: >
      Nothing in this product answers it, and nothing should — the thing being searched is the
      contract, which the core pack carries. Recorded absent because this register answers only
      for what this adapter performs.

  - name: operation.describe
    fulfilment: absent
    because: >
      As above: an operation's meaning, its refusals and its five properties come from the
      contract in the core pack, not from any API surface here.

  - name: operation.preview
    fulfilment: partial
    surface: >
      sequence-contacts -> Get sequence preview for a contact; ai-sdr-sequences -> Preview
      autopilot results; live-data -> Preview a Live Data search
    beta: true
    missing: >
      There is no general dry run. Three specific acts can be previewed, all of them beta, and
      every other write is knowable only by performing it — which means that for most operations
      the preview an approval gate wants has to be assembled from reads before the write, not
      requested from the product.
    notes: >
      Preview before Start on a Live Data search is a hard rule, not a courtesy: Start spends the
      user's allowance and Preview does not.

  - name: plan.validate
    fulfilment: absent
    because: >
      not evidenced — no surface takes a plan. Authority, ordering, preconditions and headroom are
      checked step by step against the reads each step needs, by the agent, before anything runs.

  - name: contract.describe
    fulfilment: absent
    because: >
      Nothing here describes the contract — which version is in force, what was renamed from what,
      and what it binds an agent to is the core pack's own answer, not this API's.

  - name: capability.list
    fulfilment: partial
    surface: user-account -> Get current user, List team users
    missing: >
      The granted scope set is not returned by anything. Identity and the teams a credential may
      act in are readable; what it may actually do is discovered only by making a call and reading
      an insufficient_scope refusal back. For an unattended run that means the honest per-capability
      answer is unknown until something is attempted, and unknown is not permission.
    notes: >
      Neither read needs a scope, so both work with any working credential. When a capability has
      to be known in advance, the key's scopes are visible in the product settings rather than
      through the API.

  - name: vocabulary.list
    fulfilment: partial
    surface: inbox -> List inbox categories
    scopes: [inbox:read]
    missing: >
      Only the reply categories this account has declared. Enrolment statuses, meeting outcomes,
      step intents, exit reasons, content-policy rule classes and the properties a branch
      condition may be written over have no listing at all — checked against the endpoint index,
      there is no enumeration surface. For those kinds the answer is unknown, which the contract
      allows and which is not the same as an empty list.

  - name: schema.describe
    fulfilment: partial
    surface: custom-fields -> List all custom fields, Get a custom field
    scopes: [contacts:read]
    missing: >
      Custom fields only, and only on people. No surface describes the standard fields of a record
      kind or says which of them may be written; that is prose on the record's own doc pages, read
      at call time, and it cannot be enumerated.

  - name: channel.describe
    fulfilment: absent
    because: >
      not evidenced — no documented surface states a channel's own rules: whether automation is
      sanctioned there, how its allowance works, how long a reply window stays open or what
      recording consent it expects. A sending account's configured limits are a different thing
      and belong to the sender operations; using them as an answer here would confuse one
      mailbox's ceiling with the channel's rules.

  - name: adapter.describe
    fulfilment: partial
    surface: >
      the Rate limits guide page; background-jobs -> Get a background job
    scopes: [other:read]
    missing: >
      Nothing returns any of this. The request ceilings and the queued-versus-inline rule are
      documented in prose — reporting and stats endpoints are limited harder than the rest, and a
      long write answers with a background job to poll — but batch ceilings, page sizes and the
      scope and lifetime of an idempotency key are not stated, and none of it can be read per
      installation.

  - name: adapter.verify
    fulfilment: absent
    because: >
      not evidenced — nothing here tests fulfilment. This register is the claim, made from
      documentation rather than from a run, and it is the thing a verification would check rather
      than a substitute for one.

  - name: job.get
    fulfilment: partial
    surface: background-jobs -> Get a background job, List background jobs
    scopes: [other:read]
    missing: >
      Status, progress and the terminal timestamps are documented, but the result payload is
      opaque and its shape varies by job kind, so the per-item ledger the contract requires is not
      guaranteed to be there. Where one outcome per item is needed, reconcile against the entities
      themselves rather than trusting the job to carry it.
    notes: >
      A long write completes when the job reaches a terminal state, not when the call returns.
      Never blind-retry a bulk write that failed — the first attempt may have partly succeeded.

  - name: job.cancel
    fulfilment: direct
    surface: background-jobs -> Cancel a background job
    scopes: [other:operate]
    notes: >
      Items already processed stay processed, exactly as the contract has it. Cancelling is not an
      undo: it leaves a partial result, and that result has to be reconciled and reported.

  - name: invocation.get
    fulfilment: absent
    because: >
      not evidenced — checked against the endpoint index, nothing looks a call up by the
      idempotency key it was sent with. After a lost response the only recovery is the operation's
      own check-first read, which is why every write in the contract names one.

  - name: term.resolve
    fulfilment: absent
    because: >
      Nothing here resolves a word onto a concept. The vocabularies this account declares can be
      listed, but mapping a colleague's shorthand or another system's label onto the right concept
      is the contract's own answer in the core pack.
