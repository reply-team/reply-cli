  - name: ownership.assign
    fulfilment: direct
    surface: contacts -> Change contacts owner; accounts -> Update account owner
    scopes: [contacts:operate, contacts:write]
    notes: >
      One endpoint per subject kind — people through the contact group, companies through the
      account group. There is no routing rule to defer to here, so the caller names the person;
      check they are still on the team first, because the owner listing carries no state.

  - name: assignment_policy.define
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: assignment_policy.get
    fulfilment: absent
    because: >
      not evidenced — no routing rule is stored in this product, so there is none to read and
      nothing that would say who gets the next piece of work.

  - name: book.transfer
    fulfilment: partial
    surface: >
      contacts -> Change contacts owner; accounts -> Update account owner; tasks -> Batch reassign
      tasks
    scopes: [contacts:operate, contacts:write, tasks:write]
    missing: >
      Three parts of the book move — contact ownership, account ownership and open tasks. The
