    surface: accounts -> Get an account; contacts -> Filter contacts
    scopes: [contacts:read]
    missing: >
      The owner is an attribute of the record rather than a surface of its own, so it is read with
      the record. The second half of the question has no answer here at all: nothing states
      whether acting on an unowned record would make the actor its owner, and that rule is set in
