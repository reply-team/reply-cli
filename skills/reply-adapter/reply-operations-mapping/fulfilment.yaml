  - name: goal.get
    fulfilment: absent
    because: not evidenced — no target is stored here, so there is none to read.

  - name: goal.list
    fulfilment: absent
    because: not evidenced — no target is stored here, so there is none to list.

  - name: pace.get
    fulfilment: absent
    because: >
      not evidenced — pace is a target measured against achievement, and no target exists in this
