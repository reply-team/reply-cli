# What this adapter can and cannot perform, one entry per contract operation.
#
# The contract describes the job. This file describes one product's coverage of it. Those are
# different questions, and keeping them apart is the whole reason the vendor-neutral layer exists:
# an operation missing here is a gap in this adapter, never a defect in the contract, and deleting
# an operation from the contract because this API lacks it would undo the layer entirely.
#
# Every mapping table in this skill is generated from this file. Edit here, then regenerate.
#
# ---------------------------------------------------------------------------------------------
# SCHEMA
# ---------------------------------------------------------------------------------------------
#
#   - name: campaign.enroll        # must be an operation the contract declares
#     fulfilment: direct           # direct | composed | partial | absent
#     surface: >                   # the endpoint GROUP and the doc page title. NEVER a path.
#       sequence-contacts -> Bulk add contacts to sequence
#     scopes: [sequences:operate]  # the scopes the call needs
#     beta: true                   # the surface is documented Beta or Coming soon
#     order: >                     # for `composed`: the call order that realises the operation
#     missing: >                   # REQUIRED for `partial`: which part of the promise is not kept
#     because: >                   # REQUIRED for `absent`: why, in evidence rather than guesswork
#     notes: >                     # what an agent must know to get it right
#
# THE FOUR VALUES
#
#   direct    one API surface performs it. Call it.
#   composed  several calls in a stated order realise it. Follow the order; report the operation,
#             not the calls.
#   partial   performed, but not to the contract's full promise. `missing` says which part, and an
#             agent must say so BEFORE the user commits to a route that depends on it.
#   absent    not performable here today. Say so, name what the documentation says, and never
#             substitute an adjacent endpoint. An enrichment that silently returns something else
#             is worse than a missing capability.
#
# ABSENCE IS NOT A COVERAGE CLAIM. Every operation in the contract needs an entry; the generator
# fails when one is missing. An unlisted operation is an unanswered question, not an implicit
# `absent` — silence would let this adapter quietly ignore two hundred operations and still look
# complete.
#
# ---------------------------------------------------------------------------------------------
# EVIDENCE, AND THE ONE FAILURE MODE THAT MATTERS MOST
# ---------------------------------------------------------------------------------------------
#
# `surface` names an endpoint group and a documentation page. It never names a path, a parameter
# or a body field: those come from the documentation at call time. Inventing a path is the single
# most common way an agent fails against this API, and a path written from memory here would be
# that mistake made once and then trusted forever.
#
# An operation may only be `direct`, `composed` or `partial` on evidence — a documentation page
# read, or the mapping this skill already carried. Anything else is `absent` with
# `because: not evidenced`, which is a truthful statement about our knowledge rather than a guess
# about the product. A wrong `absent` costs a user one question. A wrong `direct` costs them a
# broken run and their trust.

adapter: reply

operations:

  # -------------------------------------------------------------- worked entries, from evidence
  # These eleven are transcribed from the mapping this skill carried at 1.1.0, which was written
  # against the documentation. They are the shape every other entry should follow.

  - name: contact.search
    fulfilment: direct
    surface: contacts -> Filter contacts, List all contacts
    scopes: [contacts:read]
    notes: Filtering by email is the identity check that belongs before any create.

  - name: contact.create
    fulfilment: direct
    surface: contacts -> Import contacts
    scopes: [contacts:write]
    notes: >
      Bulk-oriented: a large import returns a background job, so the operation completes when the
      job reaches a terminal state, not when the call returns. Field mapping is decided in the
      core layer and applied here.

  - name: contact.delete
    fulfilment: direct
    surface: contacts -> the delete endpoint on its doc page
    scopes: [contacts:write]
    notes: Irreversible in this product as well as in the contract.

  - name: list.create
    fulfilment: direct
    surface: contact-lists -> Create a contact list
    scopes: [contacts:write]
    notes: Check List contact lists first — reuse beats proliferation.

  - name: campaign.get
    fulfilment: direct
    surface: sequences -> Get a sequence
    scopes: [sequences:read]
    notes: The verification read after every mutation.

  - name: campaign.activate
    fulfilment: direct
    surface: sequences -> Start a sequence
    scopes: [sequences:operate]
    notes: >
      Verify the status flipped by re-reading. The contract's approval class is unchanged by the
      mapping: it is confirm_once with a mandatory preview naming the population, and knowing
      which endpoint performs it changes nothing about that.

  - name: campaign.pause
    fulfilment: direct
    surface: sequences -> Pause a sequence
    scopes: [sequences:operate]
    notes: Cheap and reversible — the protective move, and the right first response to a misfire.

  - name: campaign.enroll
    fulfilment: direct
    surface: sequence-contacts -> Bulk add contacts to sequence
    scopes: [sequences:operate, contacts:read]
    notes: >
      Returns per-contact results. Reconcile every one — added, already in sequence, not found,
      forbidden, limit exceeded. Never summarise a partial result as success.

  - name: conversation.list
    fulfilment: direct
    surface: inbox -> List inbox categories, List and filter inbox threads
    scopes: [inbox:read]
    notes: Categories carry unread counts, so reading them first gives the shape of the work.

  - name: message.send
    fulfilment: partial
    surface: inbox -> Send a reply within a thread
    scopes: [inbox:operate]
    missing: >
      Inside a thread, only a reply. The contract's message.send is one message to one person on
      one channel, including the first one: from reply-cli 0.17.0 the direct sends (an email, a
      LinkedIn message, InMail or voice message) send the first one outside any campaign, where
      the account's Reply has the route; inside a campaign a first message is the campaign's
      step, with no surface here.
    notes: >
      The reply goes out on the thread's own channel. If that channel's account is disconnected
      the send fails — tell the user to reconnect, and never switch channel silently.
      Where the runtime carrying the work passes the reserved `provider` key inside the
      operation's arguments, `args.provider`, and the send is a direct send by email, that object
      is `{"schedule_id": "<id>"}` and nothing else: the `id` of a schedule from `reply schedule
      list`, written as a string of its digits. It goes as `--schedule-id` (from reply-cli 0.17.0). Another
      shape or another key is refused before anything is sent, with a message naming the shape;
      write the object in that shape and ask again. Reply refuses a schedule on every LinkedIn
      direct send in this version (scheduleId is not supported for LinkedIn sends in this version,
      a 400 on each LinkedIn route), so a schedule on a LinkedIn message is refused before any
      call. A message composed as a template goes by the same command, in Reply's own syntax,
      and Reply fills it in for the contact: a send Reply makes within the call is filled in
      before anything goes and refused with nothing sent where Reply cannot fill it; one held for
      a later moment or a schedule, or queued behind the account's other sends, is filled in when
      it goes and fails then. The codes, the names Reply lists, the LinkedIn sending account's
      two names and the formats that are never filled in are under reply-api, Direct sends,
      Templates.

  - name: contact.enrich
    fulfilment: absent
    surface: contact-enrichment -> enrich by email, enrich by profile URL, find email, find phone
    because: >
      Documented as available late August 2026 and not callable today. Say that, and name the date
      the documentation gives. Never substitute an unrelated endpoint.

  # --------------------------------------------------------------- families 1 to 5, from evidence
  # Discovery, contacts, audiences, import, campaigns. The eight operations of this range that
  # already have worked entries above are not repeated here.
  #
  # `scopes` is stated only where the doc page was actually read for it. Where the field is absent
  # the scope was not verified, and an agent takes it from the page at call time like everything
  # else. A guessed scope costs a 403 that reads like a permissions problem when it is not.

  # ------------------------------------------------ 01 discovery, enrichment and verification

  - name: candidate.search
    fulfilment: partial
    surface: >
      live-data -> Preview a Live Data search, with the departments, industries, job titles,
      locations and seniorities typeahead pages that build the filter
    scopes: [contacts:write]
    beta: true
    missing: >
      Preview answers how many and shows a capped sample, not the population. The whole result set
      exists only after Start a Live Data search, and Start is not a read: it buys the people and
      creates them as contacts. So "show me everyone this filter finds, before I spend anything"
      cannot be answered here.
    notes: >
      Beta, and say so as part of the plan rather than as a footnote at the end. Build the filter
      from the typeahead values instead of guessing accepted ones. Preview adds no prospects and
      consumes no credits, which is what makes it the safe half of this operation. The write scope
      on a read is what the page documents, not a mistake.

  - name: candidate.get
    fulfilment: partial
    surface: live-data -> Get a Live Data search, List Live Data searches
    beta: true
    missing: >
      The read is per search, not per person: it returns a search and what it found, and there is
      no address for one found person on their own. Once Start has run, the person is an ordinary
      contact and is read with Get a contact — so the discovery surface stops being the place to
      look at exactly the moment the person becomes ours.
    notes: >
      Check List Live Data searches for an existing near-identical search before starting another
      one. A repeat spends again and returns a different world.

  - name: candidate.promote
    fulfilment: partial
    surface: live-data -> Start a Live Data search
    scopes: [contacts:write]
    beta: true
    missing: >
      There is no promote-these-ones surface. Start finds and buys in one act: it adds everyone
      the filter returns as prospects and consumes credits per resulting contact, so the selection
      has to be made in the filter and cannot be made from a reviewed result set. The per-item
      promotion ledger the contract requires has to be read back off the search rather than off
      the call.
    notes: >
      Preview before Start, always — Start spends the user's allowance and the mistake is only
      visible once it is paid for. Show who came back in the preview and let the user approve the
      filter itself. Start can optionally drop the found people into a sequence or a list; treat
      that as enrolment and hold it to the enrolment gate rather than letting it ride along.

  - name: company.search
    fulfilment: absent
    surface: live-data -> Preview a Live Data search
    because: >
      not evidenced — the preview reports a companiesCount, but the search returns and creates
      people. No documented surface returns companies from the outside world as companies. The
      accounts endpoints search only the companies we already hold, which is a different question
      and must not be offered as an answer to this one.

  - name: company.resolve
    fulfilment: absent
    because: >
      not evidenced — no documented surface decides which company four spellings of a name refer
      to. Accounts can be filtered by what we already hold, which finds an exact-ish match and
      says nothing about the three spellings that did not match.

  - name: company.enrich
    fulfilment: absent
    because: >
      not evidenced — the enrichment surface is about people, and firmographics on a company are
      not among its documented pages. The whole enrichment group is in any case documented as
      available late August 2026 and is not callable today.

  - name: employment.check
    fulfilment: absent
    because: >
      not evidenced — nothing documented answers whether a person has left the company we have
      them at. There is no job-change monitoring surface, and the AI insights page that might
      touch on it is documented as available late August 2026 and is not callable today.

  - name: email_address.verify
    fulfilment: partial
    surface: >
      email-validations -> Estimate email validation, Schedule email validation; background-jobs
      -> Get a background job
    scopes: [contacts:operate, other:read]
    missing: >
      Two things. It validates people we already hold, taken by contact id, so a raw address that
      is not a contact yet cannot be checked without creating one first. And it returns the
      channel's verdict only — the send, hold or never_send decision the contract asks for comes
      from a contactability policy this product does not hold, so that half is the agent's own
      judgement and must be reported as such.
    notes: >
      Three calls in order: Estimate first, because it reports the eligible count and what it
      would cost against the team's quota; then Schedule, which reserves credits and returns a
      job; then poll the job to a terminal state and read the verdicts. Estimate is how the user
      approves a spend before it happens, which makes skipping it the expensive shortcut.

  - name: phone_number.verify
    fulfilment: absent
    surface: contact-enrichment -> find phone
    because: >
      not evidenced — the enrichment surface looks a number up; nothing documented checks that a
      number we already hold is reachable or reports whether it is a mobile, a desk line or a
      virtual one. Finding and verifying are different acts and the line type is the part that
      changes what may be sent. The enrichment group is in any case not callable until late
      August 2026.

  - name: enrichment_policy.define
    fulfilment: absent
    because: >
      not evidenced — no documented surface stores a buying order, an acceptance predicate or a
      spend ceiling. Each metered call carries its own limits at call time, so nothing binds the
      next one, and there is no version or author to read back.

  - name: enrichment_policy.get
    fulfilment: absent
    because: not evidenced — there is no stored policy to read, since none can be defined.

  # ------------------------------------------------ 02 contacts, identity and hygiene

  - name: contact.get
    fulfilment: direct
    surface: contacts -> Get a contact
    scopes: [contacts:read]
    notes: The read-back after every write in this family. Cheap, and the only proof the write took.

  - name: contact.resolve
    fulfilment: partial
    surface: contacts -> Filter contacts, Count filtered contacts
    scopes: [contacts:read]
    missing: >
      Filtering answers one key set per call, so resolving a collection is one call per person,
      and what comes back is a match list rather than a verdict: nothing returns "same human, this
      confident, under this rule". Ambiguity between two candidate records is something the caller
      has to notice and decide, and nothing marks it.
    notes: >
      Email is the key that behaves. Every other key is a filter over fields, which finds people
      who look similar rather than people who are the same.

  - name: contact.update
    fulfilment: direct
    surface: contacts -> Update a contact, Import contacts with an update policy
    scopes: [contacts:write]
    notes: >
      Which of the two applies depends on the dedupe policy the user chose, and that choice is the
      core layer's to make. A collection goes through the import path and comes back as a job.

  - name: contact.restore
    fulfilment: absent
    because: >
      not evidenced — the contacts group documents Delete a contact and Bulk delete contacts and
      nothing that brings one back. Treat a delete here as irreversible with no restore window,
      and say so before deleting rather than after.

  - name: timeline.get
    fulfilment: composed
    surface: >
      contacts -> Get activities for a contact, Get inbox threads for a contact, Get sequences for
      a contact, Get a contact's statuses
    scopes: [contacts:read]
    order: >
      contacts -> Get activities for a contact for what we did, then Get inbox threads for a
      contact for what came back, then Get sequences for a contact and Get a contact's statuses
      for where they stand right now.
    notes: >
      Four reads and no single chronology: each comes back per source and merging them in time
      order is this adapter's work, not the API's. Anything that happened off-platform is in none
      of them, so a timeline assembled here is what the product saw, not what happened.

  - name: provenance.set
    fulfilment: absent
    because: >
      not evidenced — no documented surface records where a person's data came from or under what
      terms. A custom field could hold the text, and must not be reported as provenance: the
      contract's version carries the lawful basis the sending decision rests on, and a field with
      a source name typed into it proves nothing.

  - name: job_change.record
    fulfilment: absent
    because: >
      not evidenced — nothing documented forks a record when somebody moves employer. Updating the
      company on the existing contact is the opposite of what the operation asks for: it destroys
      the history at the old employer, which is usually the reason we were talking to them.

  - name: cooldown.set
    fulfilment: absent
    because: >
      not evidenced — no documented surface holds a person until a date and then releases them.
      Suppression is permanent until lifted by hand, which is a different promise, and offering it
      as a cooldown means a person we meant to come back to in Q4 is never contacted again.

  - name: contact.disqualify
    fulfilment: absent
    because: >
      not evidenced — the contact status surfaces are about sequence participation and delivery
      outcomes, not about whether somebody is a prospect at all. The blacklist rules are
      suppression, a different act with a different meaning: using one for the other tells the
      user we may never contact this person, when what they said was that this person is not a
      fit.

  - name: contact.requalify
    fulfilment: absent
    because: >
      not evidenced — there is no qualification state to reverse, since none can be recorded.

  - name: contact.normalize
    fulfilment: absent
    because: >
      not evidenced — nothing documented rewrites records into a house format under a declared
      rule set while keeping what was there before. Bulk updates through the import path can
      overwrite values, which is not the same operation: it keeps no prior value and reports no
      rule set, so nothing can be undone or explained afterwards.

  - name: identity_policy.define
    fulfilment: partial
    surface: contacts -> Import contacts
    scopes: [contacts:write]
    missing: >
      The decision exists as an argument on each import — skip existing, which never overwrites,
      or update existing — and nowhere else. There is no stored policy, no version, nobody
      recorded as having set it, and the matching rules themselves are not configurable. Every
      import re-decides the question, and two imports can disagree with nothing to notice it.
    notes: >
      Because the policy cannot live in the product, it has to be carried by whatever keeps the
      user's durable context, and re-confirmed at each import rather than assumed from last time.

  - name: identity_policy.get
    fulfilment: absent
    because: >
      not evidenced — there is no stored identity policy to read back, only the choice made on
      each import, which is not recorded anywhere afterwards.

  - name: duplicate.list
    fulfilment: absent
    because: >
      not evidenced — no documented surface reports suspected duplicates. Filtering can confirm
      that two records share an address once you already suspect it; nothing proposes the clusters
      in the first place, which is the entire operation.

  - name: duplicate.merge
    fulfilment: absent
    because: >
      not evidenced — no documented surface combines two contact records into one. Deleting the
      loser and updating the winner is not a merge: it destroys the history the contract requires
      the merge to carry across, and there is no restore.

  - name: duplicate.link
    fulfilment: absent
    because: >
      not evidenced — nothing records that two records are the same human while both have to stay.

  - name: duplicate.unlink
    fulfilment: absent
    because: not evidenced — there is no link to undo, since none can be made.

  - name: duplicate.reject
    fulfilment: absent
    because: >
      not evidenced — no documented surface records a not-a-duplicate decision, so the same pair
      would be proposed again by anything that looks a second time.

  - name: field.define
    fulfilment: direct
    surface: custom-fields -> Create a custom field, List all custom fields
    scopes: [contacts:write]
    notes: >
      List first. A second field with almost the same name is how a mapping starts putting the
      right value in the wrong place, and nothing downstream will notice.

  - name: field.retire
    fulfilment: partial
    surface: custom-fields -> Delete a custom field
    scopes: [contacts:write]
    missing: >
      Delete, not retire, and nothing reports what still references the field before it goes. The
      check the contract requires before repeating — is this still used by a mapping, a filter or
      a template — has to be done by hand, and the documentation does not say what happens to the
      values already stored. Treat the loss as total until somebody demonstrates otherwise.

  # ------------------------------------------------ 03 audience and lists

  - name: segment.define
    fulfilment: absent
    because: >
      not evidenced — filters are expressed per call and no documented surface saves one under a
      name. A contact list cannot stand in for a segment: it holds people, not a definition, it
      does not re-evaluate, and it cannot say who would match tomorrow.

  - name: segment.get
    fulfilment: absent
    because: not evidenced — there is no saved definition to show, since none can be saved.

  - name: segment.list
    fulfilment: absent
    because: not evidenced — there are no saved definitions to list.

  - name: segment.delete
    fulfilment: absent
    because: not evidenced — there is nothing to retire.

  - name: segment.preview
    fulfilment: direct
    surface: >
      contacts -> Count filtered contacts, Filter contacts; live-data -> Preview a Live Data
      search
    scopes: [contacts:read, contacts:write]
    notes: >
      Two universes, two surfaces, and the cost difference the contract describes is real here:
      counting our own contacts is free, and the external preview adds no prospects and consumes
      no credits either. The external half is Beta; the internal half is not. Run whichever
      applies before anything that spends — this is the operation that makes the spend reviewable.

  - name: segment.materialize
    fulfilment: composed
    surface: >
      contacts -> Filter contacts; contact-lists -> List contact lists, Create a contact list, Add
      contacts to a contact list
    scopes: [contacts:read, contacts:write]
    order: >
      contacts -> Filter contacts to evaluate the definition, then contact-lists -> Create a
      contact list or reuse one from List contact lists, then Add contacts to a contact list, then
      contacts -> Filter contacts by that list to reconcile what actually landed.
    notes: >
      The freeze is genuine but is not recorded as one: nothing on the list says which definition
      or which as-of time produced it, so that has to be written down outside the product or the
      list becomes a set of people nobody can account for. Say before you start that there is no
      way to take people back off a list — see list_membership.remove — so a list built from the
      wrong filter is corrected by building another one.

  - name: list.list
    fulfilment: direct
    surface: contact-lists -> List contact lists
    scopes: [contacts:read]
    notes: The first call before any list.create — reuse beats proliferation.

  - name: list.get
    fulfilment: partial
    surface: contact-lists -> Get a contact list, Get contact's lists; contacts -> Filter contacts
    scopes: [contacts:read]
    missing: >
      What is on the list is readable; where it came from is not. Nothing records the definition,
      the import or the search behind a list, so the second half of the question has no answer
      here — and it must not be improvised from the list's name, which is the one place a wrong
      answer will look plausible.

  - name: list_membership.add
    fulfilment: direct
    surface: contact-lists -> Add contacts to a contact list, Move contacts to a contact list
    scopes: [contacts:write]
    notes: >
      Add and Move are different acts: Move takes people off wherever they were. Reconcile
      afterwards by filtering contacts by the list, because the count asked for and the count that
      landed differ often enough to matter.

  - name: list_membership.remove
    fulfilment: absent
    surface: contact-lists -> Move contacts to a contact list
    because: >
      not evidenced — the contact lists group documents adding and moving and nothing that takes a
      person off a list. Move relocates people to another list rather than removing them, so using
      it as a removal quietly files them somewhere else. This is the gap that makes a mis-built
      list expensive, and the honest response is to get the list right before it is written rather
      than to plan on trimming it.

  - name: list.delete
    fulfilment: direct
    surface: contact-lists -> Delete a contact list
    scopes: [contacts:write]
    notes: >
      Check what still references it first — no campaign binding is reported back, and nothing
      after the fact will tell you what broke.

  - name: audience.assess
    fulfilment: absent
    because: >
      not evidenced — no documented surface judges whether a set of people is fit to work.
      Duplicates cannot be listed, contactability is not modelled, and address verification is a
      separate metered job over contacts rather than over a list. The assessment is therefore the
      agent's own and has to be reported as a judgement, not as something the product checked.

  - name: audience.screen
    fulfilment: absent
    because: >
      not evidenced — nothing re-checks a list against the exclusion rules and takes the failures
      out. The blacklist rules can be read and a validation job can be run, but there is no
      removal from a list at all, so the second half of the operation has nowhere to land.

  - name: contactability_policy.define
    fulfilment: absent
    because: >
      not evidenced — the blacklist rules are individual exclusion entries for domains, addresses
      and exceptions, not a policy answering send, hold or never_send per verdict and per flag.
      Reporting them as one would leave every verdict the rules do not mention silently defaulting
      to send, which is exactly the failure the policy exists to prevent.

  - name: contactability_policy.get
    fulfilment: absent
    because: >
      not evidenced — there is no policy to read, only the individual blacklist entries.

  # ------------------------------------------------ 04 import

  - name: source.inspect
    fulfilment: absent
    because: >
      not evidenced as an API surface, and rightly so — the file is inspected locally, before any
      call, which is what the import ordering this skill already carried says: inspect the source
      locally, zero API calls. There is no upload-and-profile endpoint and there does not need to
      be. Do the inspection, then show the user what would land, then ask.

  - name: import.apply
    fulfilment: composed
    surface: contacts -> Import contacts, Filter contacts; background-jobs -> Get a background job
    scopes: [contacts:write, other:read]
    order: >
      contacts -> Import contacts, then background-jobs -> Get a background job polled to a
      terminal state, then contacts -> Filter contacts by the target list to reconcile created,
      updated, skipped and failed against what was asked for.
    notes: >
      A large import returns a job reference, not a result: the operation completes when the job
      reaches a terminal state, never when the call returns. A job that ends failed gets its body
      read for the reason — never blind-retry a bulk write, because the first attempt may have
      partially succeeded. The approval gate over the file, the count, the mapping, the dedupe
      policy and the target list belongs before the first call.

  - name: import.list
    fulfilment: partial
    surface: background-jobs -> List background jobs
    scopes: [other:read]
    missing: >
      There is no import history. Imports appear as background jobs among every other kind of job,
      and the documentation does not say the listing can be filtered to imports, so the question
      is answered by reading a general job list and recognising them. Anything older than that
      listing retains is simply gone.

  - name: import.get
    fulfilment: partial
    surface: background-jobs -> Get a background job
    scopes: [other:read]
    missing: >
      A job is identified by its own id, not by an import record, and the documentation does not
      state that the result carries a per-row ledger tying each source row to the contact it
      created or matched. Keep that reconciliation yourself at import time — after the fact it may
      not be recoverable at all.

  - name: import.revert
    fulfilment: absent
    because: >
      not evidenced — nothing undoes an import. Bulk deleting the contacts is not a revert: it
      destroys people the import updated rather than created, and it cannot put back a field the
      import overwrote. Say the import is not reversible before it runs, which is the only moment
      at which saying it helps anyone.

  # ------------------------------------------------ 05 campaign, schedule, windows and limits

  - name: campaign.list
    fulfilment: partial
    surface: >
      sequences -> List all sequences, Count sequences; sequence-folders -> List sequences in a
      folder
    scopes: [sequences:read]
    missing: >
      State comes back; health does not. Nothing in the listing separates a campaign that is fine
      from one that is not progressing, degraded or blocked, so "what is running, and what is
      quietly broken" needs a second pass over stats and sender health — and that verdict is this
      adapter's judgement, not a field it read.

  - name: campaign.create
    fulfilment: direct
    surface: sequences -> Create a sequence, List all sequences
    scopes: [sequences:write]
    notes: >
      Creating never arms anything: the new sequence comes back in a new state and starting it is
      a separate call with a separate approval. List first — reuse is usually right, and a
      fourteenth near-identical campaign is how a mailbox ends up sending to the same person from
      three directions.

  - name: campaign.clone
    fulfilment: composed
    surface: >
      sequences -> Save a sequence as a template, Create a sequence from a template;
      sequence-templates -> List all sequence templates
    scopes: [sequences:write]
    order: >
      sequences -> Save a sequence as a template, then Create a sequence from a template. Check
      sequence-templates -> List all sequence templates first in case the template already exists.
    notes: >
      The template route carries structure and content and not enrolments, history or results,
      which is what the contract asks of a clone. Read the new campaign back and confirm the
      schedule and sender bindings came with it before assuming they did.

  - name: campaign.update
    fulfilment: partial
    surface: sequences -> Update a sequence, Change sequence owner
    scopes: [sequences:write]
    missing: >
      Owner moves through its own endpoint, so one conceptual update is two calls. Beyond that
      there is no declared successor and no personalisation tier on the sequence: a campaign that
      hands over to another one cannot say so here and has to be tracked outside the product.
    notes: >
      The update is last-write-wins — read the campaign first, or a field nobody meant to touch is
      reverted by a call that only meant to change the name. The owner endpoint is separate and
      may carry its own scope; take it from its page.

  - name: reply_policy.set
    fulfilment: partial
    surface: sequences -> Update a sequence
    scopes: [sequences:write]
    missing: >
      One switch, not a decision per event class: a reply either finishes the person or sending
      continues, and that is the whole vocabulary. There is no per-event-class routing and no
      attribution window, so "a reply within thirty days still counts as this campaign's" cannot
      be expressed at all.
    notes: >
      Continuing to send after a reply is the setting that keeps writing to somebody who already
      answered. The contract raises this to confirm_once for exactly that reason, and learning it
      is one field on an update endpoint changes nothing about the confirmation.

  - name: schedule.set
    fulfilment: partial
    surface: >
      schedules -> Create a schedule, Update a schedule, Set default schedule; sequences -> Update
      a sequence to attach it
    scopes: [sequences:write]
    missing: >
      Windows per day and the timezone policy are there, including sending in the prospect's own
      timezone rather than the schedule's. A delay basis and an out-of-window behaviour are not:
      nothing states whether a touch falling outside a window defers to the next open one or is
      skipped, so the defer-or-skip decision the contract makes the user take has no setting to
      carry it. Holidays are all-or-nothing per schedule.
    notes: >
      Two calls: create or update the schedule, then attach it through the sequence update. A
      schedule is a shared object, so changing one silently rewrites every future date on every
      campaign pointing at it — which is the damage the contract's confirm_once is guarding
      against. Check who else uses it before editing rather than after.

  - name: pacing.set
    fulfilment: partial
    surface: sequences -> Update a sequence
    scopes: [sequences:write]
    missing: >
      People admitted per day, messages per day and a minimum gap between sends all exist, and so
      does a same-domain cap the contract does not ask for. Jitter and the cold-start ramp do not:
      a new campaign runs at its full configured rate from day one unless somebody raises the
      numbers by hand over several days, and nothing records that they intended to.
    notes: >
      These are per-campaign, which is the point of the operation — slowing this campaign without
      slowing everything else on the same mailbox. Ceilings that belong to the sending capability
      itself are set elsewhere and are not reachable from here.

  - name: sender_binding.set
    fulfilment: partial
    surface: >
      sequence-email-accounts -> Assign email account to sequence, Set sequence email accounts,
      Remove email account from sequence; sequence-linkedin-accounts -> Assign a LinkedIn account
      to a sequence
    scopes: [sequences:operate]
    missing: >
      Binding is per campaign only — named participations cannot be bound. And the documentation
      does not say what happens to people already mid-campaign when the binding changes, so the
      preview the contract requires, the one telling a user which live threads are about to change
      From address, cannot be produced from this API.
    notes: >
      Because the live-participation behaviour is undocumented, treat a rebinding on a running
      campaign as an act with an unknown blast radius: pause, rebind, read back, resume. Confirm
      the sender is healthy before binding it to anything.

  - name: campaign.validate
    fulfilment: absent
    because: >
      not evidenced — no documented surface answers whether a campaign is safe to turn on. The
      pieces a validation would read do exist separately, as steps, sender assignments, the
      schedule and the enrolled count, so the check is assembled by the agent out of several reads
      and reported as its own work. Never report it as something the product verified: an
      unpublished template or a schedule that never opens will not announce itself.

  - name: campaign.test
    fulfilment: partial
    surface: email-templates -> Send a test email, Render an email template
    scopes: [sequences:operate]
    missing: >
      It tests a template, not the campaign. There is no surface that sends step one exactly as a
      real contact would receive it, the documentation places no restriction on the recipient
      address, and nothing checks that the unsubscribe mechanism in the message actually works.
      The contract's test — receive it yourself, click the unsubscribe link, and only to an
      address the workspace can demonstrate it owns — is only partly reachable.
    notes: >
      A test send is still a send and still metered, so the contract's confirm_each stands. Say
      which parts were tested and which were not, rather than reporting a green test.

  - name: campaign.resume
    fulfilment: direct
    surface: sequences -> Start a sequence, Bulk start sequences
    scopes: [sequences:operate]
    notes: >
      The same endpoint as activation, so it will not refuse a campaign that was never paused the
      way the contract says a resume should. Read the state first and decide which operation you
      are actually performing: the two carry different approvals, and only one of them is a first
      activation.

  - name: campaign.freeze
    fulfilment: partial
    surface: >
      sequences -> Pause a sequence; or holiday-calendars -> Create a holiday calendar with
      schedules -> Link a holiday calendar to a schedule
    scopes: [sequences:operate, sequences:write]
    missing: >
      Neither route is a freeze. A pause carries no expiry and never resumes itself, so the thing
      that makes a freeze safe — that somebody forgetting about it is not a failure — is gone. A
      dated holiday calendar does expire by itself, but it suppresses at the schedule, and a
      schedule may be shared by campaigns nobody meant to stop.
    notes: >
      Say which route was taken and what it costs. A pause leaves the resume as a human's job, so
      it belongs in whatever carries work across sessions rather than in someone's memory. A
      linked calendar needs a check of which other campaigns point at that schedule, before
      linking.

  - name: campaign.unfreeze
    fulfilment: partial
    surface: >
      sequences -> Start a sequence; or schedules -> Unlink a holiday calendar from a schedule
    scopes: [sequences:operate, sequences:write]
    missing: >
      No preview of what letting it go early releases. The contract wants the count of messages
      that go out the moment the suppression lifts, and nothing here produces one, so the user is
      approving a release whose size nobody has been told.
    notes: >
      Work the release out from the enrolled counts and the pacing before asking for the
      confirmation, and say out loud that the number is an estimate rather than a reading.

  - name: campaign.archive
    fulfilment: direct
    surface: sequences -> Archive a sequence, Bulk archive sequences
    scopes: [sequences:operate]
    notes: >
      Refuses with a conflict when the campaign is already archived or in an incompatible state,
      and the documentation does not enumerate those states — so read the campaign back rather
      than inferring what the conflict meant. Stop live enrolments with a reason first, as the
      contract requires.

  - name: campaign.unarchive
    fulfilment: direct
    surface: sequences -> Unarchive a sequence, Bulk unarchive sequences
    scopes: [sequences:operate]
    notes: >
      Bringing it back into the working set does not start it sending. That is a separate call and
      a separate decision, and the contract keeps them apart for a reason.

  - name: schedule.resolve
    fulfilment: absent
    because: >
      not evidenced — nothing documented returns a resolved calendar. The schedule can be read and
      so can a linked holiday calendar, but the day-by-day answer for a campaign or for one
      person, showing what a weekend, a holiday or a closed window moved, has to be computed and
      cannot be checked against anything.

  - name: send_window.resolve
    fulfilment: absent
    because: >
      not evidenced — no documented surface answers when one person may be contacted on one
      channel. Some inputs are readable, being the schedule's windows, its timezone policy and its
      linked holiday calendars, but legal quiet hours in the recipient's local time and operator
      blackouts are not modelled at all, so the parts that carry legal weight are the ones missing.

  - name: blackout.define
    fulfilment: partial
    surface: >
      holiday-calendars -> Create a holiday calendar, Update a holiday calendar; schedules -> Link
      a holiday calendar to a schedule
    scopes: [sequences:write]
    missing: >
      Named date ranges exist, with an annual-repeat flag. Defer-or-skip does not: nothing states
      whether the touches a range stops come back afterwards or are lost, which is half of what
      the contract asks the user to decide. Nor does the create call take the region the range
      applies to, so whose region applies cannot be stated at the moment the range is drawn.
    notes: >
      A calendar suppresses nothing until it is linked to a schedule, and it then applies to every
      campaign on that schedule. Linking is the act; creating is not, and reporting the create as
      the blackout is how a holiday range ends up suppressing nothing.

  - name: blackout.list
    fulfilment: composed
    surface: >
      holiday-calendars -> List holiday calendars; schedules -> List linked holiday calendars
    scopes: [sequences:read]
    order: >
      holiday-calendars -> List holiday calendars for everything defined, then, for each schedule
      a campaign in scope actually uses, schedules -> List linked holiday calendars. An unlinked
      calendar suppresses nothing and must not be reported as suppression in force.
    notes: >
      This answers which ranges are in force and until when for the campaigns you name, not
      account-wide in one call. State the scope you checked, because the difference between "no
      blackouts" and "no blackouts on the two campaigns I looked at" is the whole answer.

  - name: blackout.remove
    fulfilment: partial
    surface: >
      schedules -> Unlink a holiday calendar from a schedule; holiday-calendars -> Delete a
      holiday calendar
    scopes: [sequences:write]
    missing: >
      The lift itself works. The preview does not: nothing says whether removing a range opens a
      window that is open right now on a live campaign, or how many messages go out as a result —
      and that preview is what the contract uses to decide whether this is an act at all. Here it
      has to be reasoned out instead of read.
    notes: >
      Unlink lifts the suppression for one schedule; delete removes the calendar from every
      schedule that used it. They are different-sized acts, and the user should be told which one
      is being proposed before they agree to it.

  - name: frequency_policy.define
    fulfilment: absent
    because: >
      not evidenced — no documented surface caps how often one person, account or domain hears
      from us across campaigns. The per-campaign same-domain limit is the nearest thing and is a
      different promise: one campaign's contacts-per-domain-per-day, not a cross-campaign,
      cross-channel cap. Offering it as one would let three campaigns touch the same person in a
      day while the limit reports as respected.

  - name: frequency_policy.get
    fulfilment: absent
    because: >
      not evidenced — there is no cap to read, since none can be defined, and the per-campaign
      same-domain limit answers a different question.

  - name: capacity.estimate
    fulfilment: absent
    because: >
      not evidenced — nothing projects whether a plan can physically run. Sending capacity, pacing
      and existing load are each readable somewhere, but no surface puts them against a planned
      volume over a stated horizon. Any answer is the agent's own arithmetic over several reads
      and has to be reported that way, with the reads it rests on named.

  # ---------------------------------------------------- families 12-16, 91 operations
  # Signals and triggers · inbound · consent, suppression and privacy · sending capability
  # and deliverability · social and messaging channels.
  #
  # Evidence: the 1.1.0 mapping this skill carried, the documentation index, and the pages
  # named below read directly. Most of this range is `absent`, which is the honest result:
  # the contract describes the whole job and no product covers all of it.

  # ------------------------------------------------------------ 12 — signals and triggers

  - name: signal.list
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing reports that someone
      changed job, visited a page, raised funding or engaged publicly.
    notes: >
      ai-sdr-intent-signals -> Industries typeahead, Technologies typeahead is the nearest
      thing and it is not this: it resolves the words a user says into values a prospect
      search accepts. Offering it here answers a different question than the one asked.

  - name: signal.get
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Without a feed there is
      nothing to read one observation from.

  - name: signal.acknowledge
    fulfilment: absent
    because: not evidenced — no documented surface was found for this.

  - name: signal_policy.define
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing arbitrates between
      two things firing on the same person, because nothing fires.

  - name: signal_policy.get
    fulfilment: absent
    because: not evidenced — no documented surface was found for this.

  - name: trigger.create
    fulfilment: partial
    surface: webhooks -> Create a webhook subscription, List supported event types
    scopes: [webhooks:write, webhooks:read]
    missing: >
      Only the watching half. A subscription delivers a named event to a listener outside the
      product; the rule's other half — producing work in response — has no surface, so the
      acting side must live in the agent runtime. The watchable set is fixed and product-side
      (message sent, opened, clicked, replied, bounced; contact opted out or finished;
      connection request sent and accepted; account connection lost or erroring), so a rule
      that must watch something outside that set cannot be expressed at all.
    notes: >
      Read List supported event types before promising a rule — the event names are the whole
      vocabulary, and a trigger written against an event that is not on that list will never
      fire rather than failing loudly.

  - name: trigger.update
    fulfilment: partial
    surface: >
      webhooks -> Update a webhook subscription, Enable a webhook subscription,
      Disable a webhook subscription
    scopes: [webhooks:write, webhooks:operate]
    missing: >
      The same half as trigger.create: what the rule watches can be changed, what it produces
      cannot, because production is not in the product.
    notes: >
      "Switch it off without losing it" maps exactly onto Disable, which is the reversible
      move. Deleting a subscription to stop it and re-creating it later is not the same act
      and loses the subscription's history.

  - name: trigger.list
    fulfilment: partial
    surface: webhooks -> List webhook subscriptions, List supported event types
    scopes: [webhooks:read]
    missing: >
      What each rule watches is listed; what it produces is not, and cannot be, since the
      producing half is external. Report the watch, and say plainly that the action behind it
      is the runtime's and not the product's.

  - name: trigger.delete
    fulfilment: partial
    surface: webhooks -> Delete a webhook subscription
    scopes: [webhooks:write]
    missing: >
      Removes the watch only. Whatever the agent runtime built on top of that event keeps
      existing and has to be taken down separately, or it becomes a rule waiting on an event
      that will never arrive again.

  - name: trigger_run.list
    fulfilment: partial
    surface: webhooks -> Get webhook delivery logs
    scopes: [webhooks:read]
    missing: >
      Deliveries, not runs. The log says which event fired and whether it reached the
      listener; what work came out of it and what a policy held back are not recorded, because
      neither the work nor the policy exists on this side. Never report a delivery count as a
      count of work done.

