  # ------------------------------------------------------- family 6 — steps, content, content policy

  - name: step.list
    fulfilment: direct
    surface: sequence-steps -> List all sequence steps, Get a sequence step
    scopes: [sequences:read]
    notes: >
      The step carries its own execution mode, which is what tells you which steps owe a human
      rather than going out on their own.

  - name: step.add
    fulfilment: partial
    surface: sequence-steps -> Create a sequence step, Bulk create sequence steps
    scopes: [sequences:write]
    missing: >
      Position is not settable. The create body has no position, order or index field, so a step
      lands after the ones already made and no reorder endpoint exists to correct it. Content is
      inline on the step rather than bound to a template version, so a step cannot reference
      published copy. A branch is expressed as a condition step plus a parent reference and a
      positive-or-negative flag, and the evaluation window and early-satisfaction behaviour the
      contract asks for have no field at all.
    notes: >
      Channel and kind arrive together as one discriminated type — email, LinkedIn with its own
      action subtype, call, SMS, WhatsApp, task, condition — and the delay is a single minutes
      value, so the contract's unit and basis have to be reduced to minutes before the call.
      Complex step work, notably variants on a live sequence and LinkedIn steps, is often better
      handed to the product's own editor than approximated here. Say so and hand off rather than
      guessing.

  - name: step.update
    fulfilment: partial
    surface: sequence-steps -> Update a sequence step
    scopes: [sequences:write]
    missing: >
      The step type is a discriminator and cannot be changed, so moving a step to another channel
      means delete and re-add, which loses the step's variants with it. Position is out of reach
      here for the same reason it is in step.add.
    notes: >
      A full replacement rather than a patch — read the step first and resend every field you are
      not changing, or the delay and the copy you left out are gone. Nothing in the documentation
      restricts the call while the sequence is live, so the in-flight statement the contract
      requires is the agent's obligation and not the API's.

  - name: step.remove
    fulfilment: direct
    surface: sequence-steps -> Delete a sequence step, Bulk delete sequence steps
    scopes: [sequences:write]
    notes: >
      Takes the step's variants and their history with it. Re-read the step list afterwards — an
      absent step is a completed removal, not a failure.

  - name: step.reorder
    fulfilment: absent
    because: >
      Neither Create a sequence step nor Update a sequence step exposes a position, order or index
      field, and no reorder endpoint is documented. Steps sit in the order they were created.
      Delete and re-add is not a substitute — it destroys variants and their measurement history,
      which is the exact loss this operation exists to prevent.

  - name: variant.add
    fulfilment: direct
    surface: sequence-steps -> Create a step variant, Bulk create step variants
    scopes: [sequences:write, sequences:operate]
    notes: >
      A variant carries a subject, a message, an enabled flag and up to three attachment
      identifiers. There is no split share, so report the split as unsettable rather than assuming
      one — which is what the operation itself already requires. Enable step variants and Disable
      step variants govern whether the step uses variants at all and need the operate scope rather
      than write.

  - name: variant.update
    fulfilment: direct
    surface: sequence-steps -> Update a step variant
    scopes: [sequences:write]
    notes: >
      The enabled flag is here, which makes disabling the right move for a variant under test.

  - name: variant.remove
    fulfilment: direct
    surface: sequence-steps -> Delete a step variant, Bulk delete step variants
    scopes: [sequences:write]
    notes: >
      Destroys the variant's measurement history. Disable it instead while a test is running.

  - name: variant.list
    fulfilment: direct
    surface: sequence-steps -> List step variants
    scopes: [sequences:read]
    notes: >
      Returns each variant's enabled flag. The share each runs at is not part of the model here,
      so report it as unavailable rather than inferring an even split.

  - name: template.create
    fulfilment: partial
    surface: email-templates -> Create an email template
    scopes: [sequences:write]
    missing: >
      No draft state. A template exists in one state and is usable the moment it is created, so
      the contract's guarantee that unreviewed copy cannot be sent is not enforced by the product
      and has to be carried by the approval gate instead.
    notes: >
      Folders organise templates — read List email template folders and List email templates
      first, because reuse beats proliferation here as much as it does for lists.

  - name: template.update
    fulfilment: partial
    surface: email-templates -> Update an email template
    scopes: [sequences:write]
    missing: >
      No versioning. The update replaces the content in place and no earlier version is kept, so
      the rule that a change always produces a new draft and never mutates published copy cannot
      be honoured. Keep the previous text yourself if anyone may need it back.
    notes: >
      Steps hold their copy inline, so changing a template does not change what a live campaign
      sends. Those are two separate edits, and which one the user actually asked for is worth
      settling before either.

  - name: template.get
    fulfilment: partial
    surface: email-templates -> Get an email template, Get template variables
    scopes: [sequences:read]
    missing: >
      No version list, no published or retired state, and no list of what binds it — steps carry
      their own copy, so there is nothing to report as a dependent.
    notes: >
      Get template variables is the read that says which merge fields the copy needs, before
      anyone renders it against a real person.

  - name: template.list
    fulfilment: partial
    surface: email-templates -> List email templates, List email template folders
    scopes: [sequences:read]
    missing: >
      The second half of the question. Folders say where a template sits; nothing says whether its
      copy is draft, published or retired, because those states do not exist here.

  - name: template.publish
    fulfilment: absent
    because: >
      No version lifecycle is documented for templates. There is no draft, no published version
      and no publish endpoint — a template is usable from the moment it exists. Never present
      creating or updating one as publishing it.

  - name: template.retire
    fulfilment: absent
    because: >
      The same absent lifecycle. Delete an email template destroys the template rather than
      retiring a version, and it cannot answer the question this operation is really asking —
      which live campaigns still depend on this copy — so it must not be substituted.

  - name: content_policy.define
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. The blacklist rules govern which
      addresses and domains may be contacted, not what the copy may say, and substituting them
      answers a different question entirely.

  - name: content_policy.list
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this.

  - name: content_policy.check
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing takes a rendered message
      and returns the rules it breaks, so copy has to be checked against the account's rules
      outside the product before it is approved.

  # ------------------------------------------------------------------------- family 7 — messages

  - name: message.draft
    fulfilment: partial
    surface: email-templates -> Render an email template, Get template variables
    scopes: [sequences:operate]
    missing: >
      The render returns a subject and a body and nothing else. The footer, the identification
      block and the unsubscribe mechanism the contract requires the draft to show are absent from
      the response, so what is previewed cannot be proved to be the whole of what would leave.
      Merge values that are missing or wrong are reported, which is the part it does keep.
    notes: >
      Renders against one contact identifier, optionally in the context of a campaign and a
      sending identity so their variables resolve too. Two other renders exist and both carry a
      beta mark — Get sequence preview for a contact under sequence-contacts, and Generate an AI
      draft reply under inbox — so say beta out loud before planning a route through either.

  - name: message.schedule
    fulfilment: partial
    surface: >
      direct-outreach -> the direct sends (an email, a LinkedIn message, InMail or voice message,
      and Send a LinkedIn connection request to a contact), each with its send-after moment
    missing: >
      Only a send outside any campaign, and only where the account's Reply has the route. From
      reply-cli 0.17.0 the direct sends take `--send-after`, a moment with its offset, which the CLI
      sends as UTC, and Reply holds the send until then; a moment already past is sent at once. A
      Reply that does not keep a direct send for later answers a bare 404, and nothing is
      scheduled. The contract's read before repeating — the pending sends for this person on this
      thread — has no list surface here: a harness that keeps the reference reads and cancels by
      it.
    notes: >
      From reply-cli 0.17.0, send with `--idempotency-key`, which goes as the Idempotency-Key header:
      the same request repeated under the same key answers the send Reply took and sends nothing
      twice, so a lost answer is repeated under the key rather than read around. Reply honours the
      key only where it has the direct-send routes, so read `reply direct-send get` of a reference
      first (from reply-cli 0.17.0): its own `direct_send.not_found` or `direct_send.not_owned` says
      the routes are there, a bare 404 says they are not, and a key sent there protects nothing.
      The answer names the send's `reference` and its `state`: `sent` means it went, `failed` and `cancelled` are final, and
      any other state means Reply holds it and it has not gone yet. Keep the reference; it is the
      only handle on the send, and after a lost answer `reply direct-send get` of it is read before
      any repeat. Reply keeps a key for a day, so a repeat goes under it only within 23 hours of
      the first try; past that, nothing is sent again. From reply-cli 0.17.0 an email direct send
      also takes `--schedule-id`, a schedule from `reply schedule list`; Reply refuses it on every
      LinkedIn route. Reply then holds the send until the schedule's first opening at or after the
      moment, or after now where none is given, and the answer names no moment: Reply estimates
      one only where the schedule opens within 30 days, and reply-cli does not pass the estimate.
      A manual-email task dated for the 14th is still queued work for a person, not a queued send.

  - name: scheduled_message.list
    fulfilment: absent
    because: >
      No surface lists the pending sends — not by person, campaign or sender. From reply-cli 0.17.0,
      `reply direct-send get <reference>` reads one send by its reference — its state, its moment,
      when it went and why it failed — which answers for a send already known and never for "what is
      queued". A harness that keeps the reference reads and cancels by it.

  - name: scheduled_message.cancel
    fulfilment: partial
    surface: direct-outreach -> the direct send's cancel, by its reference
    missing: >
      By reference only, and only where the account's Reply has the route. From reply-cli 0.17.0,
      `reply direct-send cancel <reference>` cancels one direct send still held for its moment.
      Nothing lists the pending sends, so a harness that keeps the reference reads and cancels by
      it; a send whose reference was not kept cannot be found to cancel. What is pending in a live
      participation is still the next touch of a campaign, and stopping that is enrollment.pause or
      enrollment.stop rather than this.
    notes: >
      A cancel of a send already cancelled is a success, and one whose answer was lost is safe to
      run again. A send that has gone answers `direct_send.already_sent` and one that failed
      `direct_send.already_failed`: report it as gone or failed, never as cancelled. A bare 404 means
      the account's Reply does not have the route yet.

  # ----------------------------------------------------------------------- family 8 — enrollment

  - name: enrollment.list
    fulfilment: direct
    surface: >
      sequence-contacts -> List contacts in sequence, List contacts in sequence with extended
      state; contacts -> Get sequences for a contact
    scopes: [sequences:read, contacts:read]
    notes: >
      Both ends of the same read are covered — the campaign's people, and one person's campaigns.
      Count contacts in sequence is documented as coming soon, so count by paging the list rather
      than planning around it.

  - name: enrollment.get
    fulfilment: direct
    surface: >
      sequence-contacts -> Get a contact in a sequence, List contacts in sequence with extended
      state
    scopes: [sequences:read]
    notes: >
      The extended-state listing is the one that carries progress detail; the single read is the
      cheaper check-first before a hold, a resume or a stop. Which of the fields this operation
      names are actually present comes from those two pages at call time, not from here.

  - name: enrollment.pause
    fulfilment: partial
    surface: sequence-contacts -> Set contacts' status in this sequence
    scopes: [sequences:operate]
    missing: >
      No reason is accepted and there is no dated automatic resume. The hold is a bare status, so
      why someone was held and when they should carry on again survive only wherever the agent
      chooses to write them down.
    notes: >
      At most one hundred people per call, and only a participation that is currently active can
      be held. The response returns failures keyed by person and an empty object when every one
      succeeded — reconcile per person rather than reading that empty object as a count.

  - name: enrollment.resume
    fulfilment: partial
    surface: sequence-contacts -> Set contacts' status in this sequence
    scopes: [sequences:operate]
    missing: >
      Setting a participation back to active is accepted from any current state, so the refusal
      the contract requires — resume only what is actually held — is not enforced by the API. The
      check-first read has to perform it, or a finished participation is quietly restarted and
      someone is written to again.
    notes: >
      On a live campaign this sends. The preview naming who resumes is the approval artefact and
      knowing which endpoint performs the call softens nothing about that.

  - name: enrollment.stop
    fulfilment: partial
    surface: sequence-contacts -> Remove contact from sequence, Bulk remove contacts from sequence
    scopes: [sequences:operate]
    missing: >
      The mandatory reason. The body carries identifiers and nothing else, so neither why someone
      was taken out nor that a different person was the cause can be recorded — and naming that
      other person is part of the operation, not a nicety. Record the reason wherever the run
      itself is recorded.
    notes: >
      The bulk response counts requested, removed, not found and not in sequence, and lists the
      identifiers actually removed. An already-absent participation reads as a completed stop.

  - name: disposition.set
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Marking someone replied or bounced
      records what happened to a message, and an inbox category records what a reply meant;
      neither is the business outcome of the participation, and pressing one into service as a
      stand-in corrupts the number people are measured on.

  # -------------------------------------------------------------------- family 9 — conversations

  - name: conversation.get
    fulfilment: direct
    surface: inbox -> Get inbox thread, List messages in an inbox thread
    scopes: [inbox:read]
    notes: >
      Two reads — the thread, then its messages in order. Note the thread's channel while you are
      there, because a reply has to go out on the same one.

  - name: conversation.classify
    fulfilment: partial
    surface: inbox -> Assign or clear a thread's category, Assign threads to a category
    scopes: [inbox:operate]
    missing: >
      The meaning is recorded, its provenance is not. No field carries who decided it, which
      message they decided it from, or how sure they were, so a category set by a model and one
      set by a person are indistinguishable afterwards.
    notes: >
      The vocabulary is the account's own inbox categories — read List inbox categories first and
      map onto what exists rather than inventing a label. Re-read the thread to confirm it took.

  - name: conversation.assign
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Assign threads to a category and
      Assign or clear a thread's category move a thread between categories, not between people,
      and the resemblance in the names is exactly the trap. Changing who owns the person is a
      different act with different consequences and is not a substitute.

  - name: conversation.snooze
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing takes a thread out of the
      queue and brings it back on a date.

  - name: conversation.close
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Mark threads as read records a
      read state, not a worked one, and deleting a thread destroys it. Neither says the thread was
      dealt with, which is the whole of what closing one means.

  - name: conversation.reopen
    fulfilment: absent
    because: >
      Nothing closes a thread here, so nothing reopens one. Mark threads as unread is the nearest
      surface and it says something else.

  - name: referral.record
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. The pieces exist separately, since
      the named person can be created and the referrer can be taken out of the campaign, but
      nothing records that the one came from the other — and that link is the only fact that
      justifies contacting a stranger, so performing the two calls without it is not the
      operation.

  - name: activity.log
    fulfilment: partial
    surface: contacts -> Add a note to a contact
    scopes: [contacts:operate]
    missing: >
      Only the note. A free-text note is one of the things this operation records; an email sent
      from a personal client, a conversation in a corridor, or a message on a channel we do not
      send from cannot be logged as an activity with its channel, direction and time, so the
      record stays an incomplete account of what happened to this person.
    notes: >
      Get activities for a contact is the read that shows what the product recorded itself, and a
      note is not guaranteed to appear in it. Check before telling the user the record is whole.

  # ---------------------------------------------------------------------------- family 10 — tasks

  - name: task.list
    fulfilment: direct
    surface: tasks -> List all tasks, Filter tasks
    scopes: [tasks:read]
    notes: >
      Filter tasks is the one that answers what is owed today, by due window and by owner.

  - name: task.get
    fulfilment: direct
    surface: tasks -> Get a task
    scopes: [tasks:read]
    notes: >
      A task carries the message it is asking for as a subject and a body, so this read gives a
      human what they need to do the work rather than a pointer to it.

  - name: task.create
    fulfilment: composed
    surface: tasks -> Create a task, Reassign a task
    scopes: [tasks:write]
    order: >
      Create a task, then Reassign a task when the queue belongs to somebody else — the create
      body has no assignee field, so the task lands with the calling user. Work for yourself needs
      only the first call.
    notes: >
      Type, start time, due time and a body are required, the type decides what the task is for,
      and LinkedIn work carries its own subtype. Batch reassign tasks handles a set in one call.

  - name: task.complete
    fulfilment: direct
    surface: tasks -> Complete a task, Batch complete tasks
    scopes: [tasks:operate]
    notes: >
      Marks the work done and sends nothing, which is exactly what this operation means. Execute
      and complete a task is a separate endpoint that does send the message the task holds —
      never reach for it to satisfy this operation. If the user wants the send, that is
      message.send with the approval message.send requires.

  - name: task.skip
    fulfilment: absent
    because: >
      The documented task states are new, finished, cancelled, archived and detached from a
      campaign, and none of them is skipped. The update endpoint cannot set a state at all, so
      declining a task while recording that it was declined has no surface. Completing it instead
      would put a lie in the record.

  - name: task.reschedule
    fulfilment: direct
    surface: tasks -> Update a task
    scopes: [tasks:write]
    notes: >
      Start and due times are both updatable, but the call replaces the whole task — read it
      first and resend the type, the body and the person, or they are lost. Only a task still in
      its new state can be updated, so finished work cannot be pushed to tomorrow.

  - name: task.cancel
    fulfilment: partial
    surface: tasks -> Delete a task, Bulk delete tasks
    scopes: [tasks:write]
    missing: >
      Dropping the work is possible, recording that it was deliberately dropped is not. Deletion
      destroys the task, and the cancelled state the documentation describes cannot be set through
      the update endpoint, so afterwards nothing distinguishes work called off from work that was
      never there.
    notes: >
      Say the deletion is irreversible before doing it. The contract treats this operation as
      compensatable and on this surface it is not, which is a difference the user has to hear
      first rather than discover.

  - name: task.reassign
    fulfilment: direct
    surface: tasks -> Reassign a task, Batch reassign tasks
    scopes: [tasks:write]
    notes: >
      The batch form is the one for handing over a whole queue. Reconcile per task rather than
      assuming the entire set moved.

  - name: call.place
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Execute and complete a task, the
      only endpoint that performs a task's action, supports manual email and SMS and rejects every
      other type, so a call task cannot be dialled through the API. Calls are placed in the
      product, and the user needs telling that plainly.

  - name: call.log
    fulfilment: absent
    because: >
      not evidenced — call activity is readable through reporting, under Get calls reporting
      overview and List call activity, and nothing writes one. A call that happened away from the
      product cannot be recorded here.

  - name: call_recording.get
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this, and none for the agreement that
      permitted the recording either.

  - name: call_recording.discard
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. A recording that has to be
      destroyed must be dealt with in the product, and that has to be said out loud rather than
      left for the user to assume an agent handled it.

  # ------------------------------------------------------------------------- family 11 — meetings

  - name: meeting.propose
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing offers times and nothing
      hands over a way to pick one. Toggle thread meeting-intent marks that a thread is about a
      meeting and proposes nothing, so it must not be read as a booking surface.

  - name: meeting.book
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Meetings appear in reporting as
      facts that already happened; no endpoint creates one, issues an invitation, or records a
      meeting that was invited elsewhere.

  - name: meeting.confirm
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. There is nothing to read a
      meeting's attendee responses from and nothing that chases the people who have not answered.

  - name: meeting.reschedule
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. With no booking surface there is
      no meeting here to move.

  - name: meeting.cancel
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Tell the user to cancel it in the
      calendar rather than leaving someone expecting a meeting nobody will attend.

  - name: meeting_outcome.record
    fulfilment: absent
    because: >
      not evidenced — the meetings report carries when a booking was made, by whom, from which
      campaign and on which channel, and no outcome field of any kind. Held, no-show and cancelled
      beforehand cannot be told apart here, which also means meeting outcomes cannot be read back
      out of this product later.

  - name: meeting.list
    fulfilment: partial
    surface: reports -> List meetings
    scopes: [reporting:read]
    missing: >
      A booking ledger rather than a calendar. A row gives who booked it, the channel it came
      from, the person, the campaign and when the booking was made — not when the meeting is, who
      is attending, how to join, or how it went. Nothing upcoming can be answered from it and no
      outcome can be read out of it.
    notes: >
      Filterable by date window and by user, so it does answer how many meetings were booked and
      by whom over a stated period. Measurement is rate-limited harder than the rest of the
      surface — sequential calls, cached within the session, no polling.

  - name: meeting.get
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. The reporting list is the only
      place a meeting appears at all and it has no per-meeting read.

  - name: qualification.record
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Custom fields could be made to
      hold the answers, but that is a schema somebody would have to invent, and inventing it here
      would produce a record no other run could read back.

  - name: handoff.create
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Changing who owns a person moves
      the record; it makes no offer, starts no clock, and can be neither accepted nor refused, so
      it is not this operation.

  - name: handoff.accept
    fulfilment: absent
    because: >
      Nothing creates a handoff here, so there is nothing to accept and no commitment clock to
      start.

  - name: handoff.reject
    fulfilment: absent
    because: >
      Nothing creates a handoff here, so there is nothing to refuse.

  - name: handoff.return
    fulfilment: absent
    because: >
      Nothing creates or accepts a handoff here, so there is nothing to give back.

  - name: handoff.withdraw
    fulfilment: absent
    because: >
      Nothing creates a handoff here, so there is nothing to pull back.

  - name: handoff.list
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. Nothing shows what has been handed
      over and left unanswered, in either direction.

  - name: handoff.get
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this.

  - name: opportunity.create
    fulfilment: absent
    because: >
      not evidenced — no documented surface was found for this. A conversion into a deal is
      recorded wherever the pipeline lives, and this adapter has no view of that. Name the system
      the user should record it in rather than approximating it with a field on a person or an
      account.


  # ------------------------------------------------------------ 17 — oversight, review and safety
  # Evidence: the AI SDR pending-approval and sequence-settings pages, the contact blacklist rule
  # group, and the endpoint index checked for a stop-rule, budget, escalation or review surface.

  - name: approval.request
    fulfilment: absent
    because: >
      No documented surface puts an item into a queue for a human. The pending-approval endpoints
      list, read, send, reject and regenerate items that are already there — the AI SDR sequence
      generates them itself under the approval mode set on that sequence, and nothing else can be
      queued for review.

  - name: approval.list
    fulfilment: partial
    surface: ai-sdr-pending-approvals -> List pending approvals
    scopes: [ai-sdr:read]
    beta: true
    missing: >
      Only AI-generated messages inside an AI SDR sequence reach this queue, on email and
      LinkedIn. A bulk write, a piece of content or a policy change waiting on a human has no
      queue here at all, so an empty queue does not mean nothing is waiting.
    notes: >
      Each item carries when it was created rather than how long it has waited — the age the
      operation reports is computed from that. The queue can be filtered by sequence and by user.

  - name: approval.get
    fulfilment: partial
    surface: ai-sdr-pending-approvals -> Get pending approval for a contact
    scopes: [ai-sdr:read]
    beta: true
    missing: >
      The item is addressed by contact rather than by an approval identifier, and only an
      AI-generated message is retrievable this way. Anything else a human is being asked to
      approve has no item to fetch.

  - name: approval.resolve
    fulfilment: partial
    surface: >
      ai-sdr-pending-approvals -> Send a pending approval, Send a batch of pending approvals,
      Reject (delete) a pending approval
    scopes: [ai-sdr:write]
    beta: true
    missing: >
      Rejection records no reason and is heavier than the contract's reject: it discards the
      queued draft and removes the contact from the sequence, with nothing documented to bring
      either back. Tell the user that before they reject, and keep the reason wherever the run is
      recorded.
    notes: >
      Approving is the send, exactly as the contract has it, so the approval class is unchanged by
      the mapping — one named recipient is confirm_each, and the batch send is confirm_once over a
      preview that names the population.

  - name: autonomy.get
    fulfilment: partial
    surface: ai-sdr-sequences -> Read AI SDR sequence settings
    scopes: [ai-sdr:read]
    beta: true
    missing: >
      One AI SDR sequence's own settings — whether its generated messages need approval, and
      whether autopilot is on. Nothing states what a credential may do unattended across the
      account, and there is no queue timeout, unattended action cap or escalation target to read.
      Everywhere else, autonomy is the agent's own policy held outside this product.

  - name: autonomy.set
    fulfilment: partial
    surface: >
      ai-sdr-sequences -> Set the approval mode, Enable autopilot, Disable autopilot
    scopes: [ai-sdr:operate]
    beta: true
    missing: >
      The gate and the mode, on one AI SDR sequence. The queue timeout and what a timeout means,
      the unattended action cap, the escalation target and per-channel differences have no setting
      here.
    notes: >
      Turning the gate off can also release everything already waiting, in the same call. That
      makes loosening the gate a send, not a settings change, and it must be previewed and
      approved as one.

  - name: escalation.raise
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: escalation.list
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: escalation.resolve
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: editorial_review.record
    fulfilment: absent
    because: >
      not evidenced — no documented surface binds a named human's review to a sent message. A
      message approved out of the AI SDR queue records that it was sent, which is not the same
      fact and must never be reported as one.

  - name: editorial_review.get
    fulfilment: absent
    because: >
      not evidenced — nothing records the review, so nothing can return it. The honest answer to
      an auditor here is that no review evidence exists in this product.

  - name: review.request
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: review.list
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: review.get
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: review.score
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: feedback.record
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: review_policy.define
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: review_policy.get
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: scorecard.define
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: scorecard.list
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: scorecard.publish
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: scorecard.retire
    fulfilment: absent
    because: not evidenced — no documented surface was found for this

  - name: coaching.summarize
    fulfilment: absent
    because: >
      not evidenced — the reporting surfaces cover activity and performance, not coaching. Nothing
      records that someone attended, listened, commented, scored or gave feedback, so there is
