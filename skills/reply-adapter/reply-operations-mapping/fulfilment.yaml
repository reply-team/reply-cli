  # -------------------------------------- 15 — sending capability and deliverability

  - name: sender.list
    fulfilment: partial
    surface: >
      email-accounts -> List email accounts, Filter email accounts;
      linkedin-accounts -> List LinkedIn accounts, List pending LinkedIn accounts
    scopes: [channels:read]
    missing: >
      Two lists rather than one, and only two of the four capability classes. Mailboxes and
      social accounts are covered; numbers and business messaging identities have no group at
      all, so a channel the user asks about may be invisible rather than empty.
